name: Publish ArbiFlow public case study

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble allowlisted public website
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site/assets _site/docs
          cp index.html index.en.html robots.txt _site/
          cp assets/site.css assets/brand.svg assets/view-only.js _site/assets/
          cp docs/*.html _site/docs/
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
